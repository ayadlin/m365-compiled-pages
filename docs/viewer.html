<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation - M365 WebApps</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/docs/markdown.css">
  <style>
    .doc-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    .doc-header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid rgba(var(--accent-rgb), 0.3);
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 1rem;
      border-radius: 8px;
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" style="text-decoration: none; color: inherit; display: inline-block;">
      <img id="logo" height="48" alt="M365 WebApps Logo" style="cursor: pointer;">
    </a>
    <h1>M365 WebApps Documentation</h1>
    <p style="margin: 0; font-size: 0.9rem; color: var(--accent); font-weight: 600;">by Ytech</p>
  </header>

  <div class="doc-container">
    <div class="doc-header">
      <a href="/portal/enterprise/dashboard" class="back-link">← Back to Dashboard</a>
      <h1 id="docTitle">Loading...</h1>
    </div>

    <div id="loading" class="loading">
      <p>Loading documentation...</p>
    </div>

    <div id="error" class="error" style="display: none;">
      <strong>Error:</strong> <span id="errorMessage"></span>
    </div>

    <div id="content" class="markdown-body" style="display: none;">
      <!-- Markdown content will be rendered here -->
    </div>
  </div>

  <!-- Marked.js - Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>

  <script>
    // Set logo based on theme
    function updateLogo() {
      const logo = document.getElementById('logo');
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      logo.src = isDark ? '/logo-dark.svg' : '/logo-light.svg';
    }
    updateLogo();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateLogo);

    // Get markdown file from query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const mdFile = urlParams.get('doc');

    if (!mdFile) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('errorMessage').textContent = 'No documentation file specified. Use ?doc=FILENAME.md';
    } else {
      loadMarkdown(mdFile);
    }

    async function loadMarkdown(filename) {
      try {
        const response = await fetch(`/docs/${filename}`);

        if (!response.ok) {
          throw new Error(`Failed to load documentation: ${response.status} ${response.statusText}`);
        }

        const markdown = await response.text();

        // Configure marked options
        marked.setOptions({
          breaks: true,
          gfm: true,
          headerIds: true,
          mangle: false
        });

        // Extract title from first heading
        const titleMatch = markdown.match(/^#\s+(.+)$/m);
        const title = titleMatch ? titleMatch[1] : filename;

        // Remove first H1 from markdown to avoid double title
        const markdownWithoutFirstH1 = markdown.replace(/^#\s+.+$/m, '');

        // Render markdown to HTML
        const html = marked.parse(markdownWithoutFirstH1);

        // Update page
        document.getElementById('docTitle').textContent = title;
        document.title = `${title} - M365 WebApps`;
        document.getElementById('content').innerHTML = html;

        // Show content, hide loading
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Add smooth scrolling to anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
          anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
              target.scrollIntoView({ behavior: 'smooth' });
            }
          });
        });

      } catch (error) {
        console.error('Error loading markdown:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('errorMessage').textContent = error.message;
      }
    }
  </script>
</body>
</html>
