<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal - M365 WebApps</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/portal/static/css/index.css">
</head>
<body>
  <header>
    <a href="/" style="text-decoration: none; color: inherit; display: inline-block;">
      <img id="logo" height="48" alt="M365 WebApps Logo" style="cursor: pointer;">
    </a>
    <h1>Customer Portal</h1>
    <p style="margin: 0; font-size: 0.9rem; color: var(--accent); font-weight: 600;">M365 WebApps by Ytech</p>
  </header>

  <!-- Admin access link - only visible to authorized users -->
  <a href="https://api.ytech.tools/admin/dashboard" class="admin-link" id="admin-link">🔧 Admin Dashboard</a>

  <div class="back-links">
    <a href="/m365/" class="nav-back-link primary">← M365 WebApps</a>
    <a href="https://ytech.tools/" class="nav-back-link">🏠 Ytech Home</a>
  </div>

  <div class="portal-container">
    <div class="portal-card">
      <h1>🔐 Access Your Account</h1>
      <p>Enter your email address to receive a secure login link</p>

      <div id="messageContainer"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="your@email.com"
            autocomplete="email"
          >
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          Send Login Link
        </button>
      </form>

      <div style="text-align: center;">
        <a href="/m365/" class="back-link">← Back to M365 WebApps</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="/terms.html">Terms of Service</a> | <a href="/privacy.html">Privacy Policy</a> | &copy; 2025 Ytech
  </footer>

  <script src="/portal/static/js/index.js"></script>
  <script src="/ga.js"></script>
</body>
</html>
